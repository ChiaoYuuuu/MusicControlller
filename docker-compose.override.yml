version: "3.9"

services:
  web:
    volumes:
      - .:/code/MusicController
    environment:
      DB_HOST: db
    command: >
      sh -c "
        python manage.py migrate &&
        python manage.py runserver 0.0.0.0:8000
      "
    depends_on:
      - redis

  redis:
    image: redis:7.2.4-alpine
    container_name: redis
    ports:
      - "6379:6379"
    platform: linux/amd64

  worker:
    volumes:
        - .:/code/MusicController
    environment:
      DB_HOST: db
    build: .
    command: celery -A project_root worker --loglevel=info
    depends_on:
      - web
      - redis

  beat:
    volumes:
      - .:/code/MusicController
    environment:
      DB_HOST: db
    build: .
    command: celery -A project_root beat --loglevel=info
    depends_on:
      - web
      - redis
