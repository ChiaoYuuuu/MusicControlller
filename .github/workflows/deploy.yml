name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Build and collect static (optional)
        run: |
          python manage.py collectstatic --noinput || true
      - name: Deploy (placeholder)
        run: |
          echo 'Deploy to production server or platform here.'
          # 這裡可替換為 scp/docker login/k8s deploy/ssh 等自動化部署指令 